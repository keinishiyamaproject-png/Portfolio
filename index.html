<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission: Space — Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --nasa-blue:#0B3D91;
  --glow-cyan:#00E5FF;
  --deep-space:#020408;
  --hud-green:#39FF14;
  --font-display:'Orbitron',monospace;
  --font-mono:'Share Tech Mono',monospace;
  --font-body:'Inter',sans-serif;
}

html{scroll-behavior:smooth;overflow-x:hidden;}

body{
  background:var(--deep-space);
  color:#fff;
  font-family:var(--font-body);
  cursor:none;
  overflow-x:hidden;
}

/* CURSOR */
#custom-cursor{
  width:12px;height:12px;
  border:1.5px solid var(--glow-cyan);
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
}

#cursor-trail{
  width:32px;height:32px;
  border:1px solid rgba(0,229,255,0.3);
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:9998;
  transform:translate(-50%,-50%);
}

/* NAV */
nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  padding:1rem 3rem;
  background:rgba(2,4,8,0.7);
}

.nav-links{
  display:flex;
  gap:2rem;
  list-style:none;
}

.nav-links a{
  color:rgba(255,255,255,0.6);
  text-decoration:none;
  font-family:var(--font-mono);
}

/* HERO */
#hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  padding:2rem;
}

.hero-name{
  font-family:var(--font-display);
  font-size:clamp(2.5rem,8vw,6rem);
  background:linear-gradient(135deg,#fff,var(--glow-cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* PROJECTS */
.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:2rem;
}

.project-card{
  padding:2rem;
  border:1px solid rgba(0,229,255,0.2);
}

/* TAG */
.tag{
  font-size:0.6rem;
  padding:0.3rem 0.7rem;
  border:1px solid rgba(0,229,255,0.4);
}

/* CONTACT */
.contact-link{
  color:var(--glow-cyan);
}

/* FOOTER */
footer{
  padding:2rem;
  text-align:center;
  opacity:0.4;
}

/* ANIMATIONS */
.reveal{opacity:0;transform:translateY(30px);transition:0.6s;}
.reveal.visible{opacity:1;transform:none;}

/* ========== MOBILE FIX ========== */
@media (max-width:768px){

  body{cursor:auto;}

  #custom-cursor,#cursor-trail{
    display:none;
  }

  nav{
    flex-direction:column;
    padding:1rem;
    gap:0.5rem;
  }

  .nav-links{
    justify-content:center;
    flex-wrap:wrap;
  }

  #hero{
    padding:6rem 1rem 3rem;
  }

  .projects-grid{
    grid-template-columns:1fr;
  }

  .project-card{
    padding:1.5rem;
  }

  .hero-name{
    letter-spacing:2px;
  }
}
</style>
</head>

<body>

<div id="custom-cursor"></div>
<div id="cursor-trail"></div>

<nav>
  <div>Mission Control</div>
  <ul class="nav-links">
    <li><a href="#hero">Home</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section id="hero">
  <h1 class="hero-name">KEI NISHIYAMA</h1>
  <p>Aerospace Engineering Portfolio</p>
</section>

<section id="projects" class="projects-grid">

  <div class="project-card reveal">
    <h3>Rocket Simulator</h3>
    <p>Delta-V analysis using Tsiolkovsky equation.</p>
    <div class="tag">Python</div>
  </div>

  <div class="project-card reveal">
    <h3>Trajectory Model</h3>
    <p>Projectile motion simulation for launch angles.</p>
    <div class="tag">Physics</div>
  </div>

</section>

<section id="contact" class="reveal">
  <h2>Contact</h2>
  <a class="contact-link" href="https://github.com/createKei">GitHub</a>
</section>

<footer>
  © 2026 Kei Nishiyama
</footer>

<script>
/* CURSOR */
const cursor=document.getElementById("custom-cursor");
const trail=document.getElementById("cursor-trail");

let mx=0,my=0,tx=0,ty=0;

document.addEventListener("mousemove",e=>{
  mx=e.clientX;my=e.clientY;
  cursor.style.left=mx+"px";
  cursor.style.top=my+"px";
});

function animate(){
  tx+=(mx-tx)*0.15;
  ty+=(my-ty)*0.15;
  trail.style.left=tx+"px";
  trail.style.top=ty+"px";
  requestAnimationFrame(animate);
}
animate();

/* SCROLL REVEAL */
const els=document.querySelectorAll(".reveal");

const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("visible");
    }
  });
});

els.forEach(e=>obs.observe(e));
</script>

</body>
</html>
